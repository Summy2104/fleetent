[project]
name = "fleetent"
version = "0.2.0"
description = "Lean on-premises agent platform for enterprise IM (Slack/Telegram). No framework."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "slack-bolt>=1.18.0",
    "aiohttp>=3.9.0",
    "python-telegram-bot>=21.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "alembic>=1.13.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0.3",
    "apscheduler>=3.10",
    "aiosqlite>=0.22.1",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "prompt_toolkit>=3.0.50",
    "rich>=14.0",
    "websockets>=12.0",
    "cryptography>=48.0.0",
    "html2text>=2024.2.26",
]

[project.scripts]
fleetent = "fleetent.__main__:main"
fleetent-admin = "fleetent.platform.admin_cli.main:main"
fleetent-tui = "fleetent.tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetent"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "types-pyyaml>=6.0.12.20260518",
    "pytest-cov>=7.1.0",
    "types-openpyxl>=3.1.5.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are call-in-default by design (suppress B008).
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
