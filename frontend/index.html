<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>fleetent admin</title>
    <script>
      // Dark-first: add `.dark` before paint unless the user picked light.
      // Keep in sync with src/app/theme.tsx (STORAGE_KEY + default).
      try {
        if (localStorage.getItem('fleetent.admin.theme') !== 'light') {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch {
        document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module" ></script>
  </body>
</html>
