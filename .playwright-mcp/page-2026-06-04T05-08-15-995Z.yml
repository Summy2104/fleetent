                - generic [ref=e115]: "查询单条动账流水详情（按流水主键 ID）。 对应中台「账户流水」列表行点击「编辑」时拉取的详情接口。 返回 ``DynamicTransactionsRecordV2`` 表全字段（``fields=__all__``）+ ``tag`` 数组。 与 list 工具相比，详情接口额外返回的常用字段： - transfer_tag_id / transfer_tag: 手录入流水的「划转标签」（解析自 info JSON） - ns_mail_title: NS 流程邮件标题（解析自 info JSON） - amount: 原始金额绝对值（详情中无符号，方向看 transactions_type） - fee: 手续费（已截断到 8 位小数） - 其他原始字段：fingerprint / created_at / updated_at / info / ... Args: transaction_id: 流水主键 ID（必填，正整数）。 通常来自 ``list_account_transactions`` 的 ``id`` 字段。 Returns: JSON 字符串：流水完整字典；失败返回 ``{\"error\": \"...\"}``。"
