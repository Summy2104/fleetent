                - generic [ref=e112]: "查询「账户流水」列表（动账流水 V2）。 对应中台页面：账户管理 → 资产 → 账户流水。 覆盖所有账户的：充值 / 提现 / 母子账户划转 / 账户内划转 / 手工录入收入/支出 等动账记录，并附带 TxnID 风险等级、关联来源/目标账户、NS 流程关联信息。 ⚠️ 必填约束： 后端为防止全表扫描，要求至少传入 ``account_id`` 或 ``account_code`` 之一， 否则直接返回错误。 返回分页 JSON 结构： - count: 命中总条数 - total_pages: 总页数 - current_page: 当前页码 - results: 流水列表，每条主要字段（中文标签 ← 字段名）： * 账户ID ← account * 账户编码 ← account_code * 账户名称 ← account_name * 平台 ← market（数字 ID） * 动账时间 ← date（UTC+0） * 动账类型 ← transactions_type（字典见下） * 项目号 ← project_code * 合作公司 ← partner_company * 平台币种 / 网络 ← code_name / chain_name * 基础币种 / 网络 ← base_code / base_chain * 流入数量 ← in_amount * 流出数量 ← out_amount * TxnID ← tx_id * 流水标签 ← tag（int 数组，标签 ID 列表） * 手续费 / 币种 ← fee / fee_code * 来源地址 ← from_address * 关联来源账户 ← from_account_id / from_account_name / from_account_type * is_from_address（1=匹配到本系统账户） * 目标地址 ← to_address * 关联目标账户 ← to_account_id / to_account_name / to_account_type * is_to_address（1=匹配到本系统账户） * TxnID风险等级 ← alertLevel（'5'=无风险默认） * 风险说明 ← service * 警报ID ← externalId * 警报金额 ← alertAmount * 曝光类型 ← exposureType * 备注 ← description * NS流程关联 ← ns_flow_info（含 ns_email_title / ns_flow_id / ns_tx_id） * 状态 ← status 字典约定： - transactions_type: 1=充值 / 2=提现 / 3=母子账户划转 / 4=账户内划转 / 6=手录入收入 / 7=手录入支出 - status: '1'=成功，其他取值见后端字典 flow_status_list - alertLevel: '5'=无风险（默认）；其他取值见前端字典 addressRiskLevelList - account_nature: 1=普通 / 2=子账户 / 3=母账户 - market_id: 交易所/链 ID（如 Binance=4 / OKX=10 / Bybit=19 / Bitget=42 / Gate=43 / Deribit=44 / 链类账户其他 ID） Args: account_id: 账户主键 ID，精确匹配。**与 account_code 至少二选一**。 account_code: 账户编码，前缀模糊匹配（istartswith）。**与 account_id 至少二选一**。 account_name: 账户名称，前缀模糊匹配。 market_id: 平台 ID；多值用英文逗号分隔（如 \"4,10,19\"），in 匹配。 address: 来源/目标地址，前缀模糊匹配（任一命中即可）。 tx_id: 链上 TxnID，精确匹配（不区分大小写）。 code_name: 平台币种，前缀模糊匹配（如 \"USDT\"）。 chain_name: 平台网络/链名，前缀模糊匹配（如 \"TRC20\"）。 base_code: 基础币种（标准化后）。 base_chain: 基础网络（标准化后）。 transactions_type: 动账类型字典值（如 \"1\"/\"2\"/\"3\"...）。 status: 状态字典值（如 \"1\" 成功）。 tag: 流水标签 ID；多值用英文逗号分隔（in 匹配，命中任一即可）。 project_id: 项目主键 ID；多值用英文逗号分隔。 project_code: 项目编号，前缀模糊匹配。 partner_company: 合作公司名称；多值用英文逗号分隔（精确 in 匹配）。 account_owner: 开户主体；多值用英文逗号分隔。 account_nature: 账户类型（1/2/3）。 tx_start_time: 动账时间-起（含），格式 \"YYYY-MM-DD HH:MM:SS\" 或 ISO。 tx_end_time: 动账时间-止（含当日 23:59:59，后端会自动归一）。 amount_start: 数量区间-起（>= ）。 amount_end: 数量区间-止（<= ）。 alert_level: TxnID 风险等级（如 \"1\"/\"2\"/.../\"5\"）。 exposure_type: 曝光类型 ID（与 listObj.exposureTypeList 对应）。 ids: 指定流水 ID 列表，逗号分隔（如 \"100,101\"）。 id: 单个流水 ID 精确匹配。 ordering: 排序字段（DRF 风格），前缀 `-` 为降序。默认 `-date`。 可选：date / amount / in_amount / out_amount 等。 page_num: 页码，从 1 开始，默认 1。 page_size: 每页条数，默认 50。前端可选 50/100/150/200。 Returns: JSON 字符串：分页结果；失败返回 ``{\"error\": \"...\"}``。"
