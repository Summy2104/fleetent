              - generic [ref=e89]:
                - code [ref=e90]: balance_get_account_balance
                - generic [ref=e91]: "查询账户的全部资产余额，按子账户类型分组返回。 支持通过 account_id 或 name 精确查询。 返回 JSON 结构说明： - account_id: 账户ID - total_value_usd: 该账户所有子账户的总资产估值(USD) - balances: 各子账户类型的资产列表，每项包含： - balance_type_name: 子账户类型标识 - balance_type_desc: 子账户类型中文名称（如\"币币账户\"、\"VIP借币账户\"） - market_name: 交易所名称（如 binance, okx） - total_value_usd: 该子账户类型的总估值(USD) - field_template: data 中各字段的含义描述，每项含 label(中文名) 和 prop(字段名) - data: 该类型下的资产明细列表 - position: 合约持仓信息（仅合约类型有） 不同 balance_type 的 data 字段含义不同，请参考 field_template 理解字段： ■ spot（币币账户）：code=币种, total=总数量, free=可用, used=冻结, price=价格, value=估值 ■ vip_loan（VIP借币）：code=币种, total=权益(负数=负债), borrowed=已借, interest=利息 ■ future/delivery（合约）：code=币种, total=权益, walletBalance=钱包余额, unrealizedProfit=未实现盈亏 ■ cross_margin/isolated_margin（杠杆）：code=币种, total=权益, borrowed=已借, interest=利息 ■ funding（资金账户）：code=币种, total=总数量, free=可用, used=冻结 ■ savings/flexible_earn/locked_earn（理财/赚币）：code=币种, total=权益, initialBalance=本金 Args: account_id: 账户ID（与 name 二选一）。 name: 账户名称（精确匹配，与 account_id 二选一）。"
              - generic [ref=e92]:
                - code [ref=e93]: balance_get_account_balance_snapshot
                - generic [ref=e94]: "查询账户在指定时间点的资产快照（历史余额），按子账户类型分组返回。 资产快照按 15 分钟粒度采集，因此 snapshot_time 必须是 15 分钟整点 （分钟为 00/15/30/45），否则会返回错误。 返回结构与 get_account_balance 完全一致（额外多一个 snapshot_time 字段）， 字段含义参考 get_account_balance 的 field_template 说明。 Args: snapshot_time: 快照时间，格式 'YYYY-MM-DD HH:MM'， 必须是 15 分钟整点，例如 '2025-10-25 19:30'、'2025-10-25 19:45'。 account_id: 账户ID（与 name 二选一）。 name: 账户名称（精确匹配，与 account_id 二选一）。"
              - generic [ref=e95]:
                - code [ref=e96]: exchange_rate_get_exchange_rate_report
                - generic [ref=e97]: "获取法币历史汇率报告，生成 Excel 文件。 根据 base（源币种）和 quote（目标币种）查询指定月份范围的历史汇率。 生成包含每日汇率明细 + 整体平均汇率 + 每月平均汇率的 Excel 文件。 示例: - SGD/HKD 2025年1月到3月: base=SGD, quote=HKD, start_year=2025, start_month=1, end_year=2025, end_month=3 - USD/CNY 2025年全年: base=USD, quote=CNY, start_year=2025, start_month=1, end_year=2025, end_month=12 - SGD/USD 2025年3月: base=SGD, quote=USD, start_year=2025, start_month=3, end_year=2025, end_month=3 Args: base: 源币种 ISO 4217 代码，如 SGD、USD、EUR。 quote: 目标币种 ISO 4217 代码，如 HKD、CNY、JPY。 start_year: 起始年份，如 2025。不传默认当前年。 start_month: 起始月份 1-12。不传默认 1。 end_year: 结束年份，如 2025。不传默认与 start_year 相同。 end_month: 结束月份 1-12。不传默认 12。"
              - generic [ref=e98]:
                - code [ref=e99]: cex_list_exchange_rate_accounts
                - generic [ref=e100]: "查询「账户费率管理」列表（数字货币中心化交易所母账户）。 对应中台页面：账户管理 → 数字货币账户 → 账户费率管理。 覆盖范围：Binance / OKX / Bitget / Gate / Bybit / Deribit 的母账户 （account_type=3）。 返回分页 JSON 结构： - count: 命中总条数 - total_pages: 总页数 - current_page: 当前页码 - results: 账户列表，每条含字段（中文标签 ← 字段名）： * 账户ID ← id * 账户编码 ← code * 平台 ← market（数字 ID） * 账户名称 ← name * 账户状态 ← status * 启用状态 ← enable_status * 资产/USD ← value（账户折美元估值） * 开户主体 ← account_owner * Level（用户等级） ← vip_level * 其他 ← uid / address / tag / modifier 字典取值约定： - enable_status: \"1\" 启用 / \"2\" 关闭 / \"3\" 待启用 / \"0\" \"--\"（未配置） - status: 账户状态字典 assets_account_status，常见 \"1\" 启用 - market 数字 ID: 通过中台 market 字典解析（Binance/OKX/Bitget/Gate/Bybit/Deribit 等） - vip_level: Deribit（market=44）不支持 API 读取等级，返回值为 「中台根据费率反推匹配的等级，仅供参考」 Args: id: 账户主键 ID，精确匹配。 code: 账户编码，模糊匹配（icontains）。 name: 账户名称，模糊匹配（icontains）。 account_owner: 开户主体；多值用英文逗号分隔（如 \"3621,3622\"）。 uid: 交易所侧 UID，精确匹配。 tag: 账户标签；多值用英文逗号分隔（in 匹配）。 market: 平台/市场 ID；多值用英文逗号分隔（in 匹配，如 \"1,4,10\"）。 address: 账户地址，模糊匹配（icontains）。 status: 账户状态精确匹配（如 \"1\"）。 enable_status: 启用状态精确匹配（1/2/3/0）。 ordering: 排序字段（DRF 风格），前缀 `-` 为降序。 默认 `-value`（按资产从大到小）。 可选：id / code / name / market / status / enable_status / value / account_owner / vip_level。 page_num: 页码，从 1 开始，默认 1。 page_size: 每页条数，默认 50。前端可选 50 / 100 / 150 / 200， 最大 1000。"
