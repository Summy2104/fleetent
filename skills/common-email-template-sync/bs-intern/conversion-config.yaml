# ═══════════════════════════════════════════
# 占位符库
# ═══════════════════════════════════════════
# 命名规范：小写字母 + 下划线。转换时优先复用此库中的名称。

placeholders:
  # 通用
  - name: "business_line"
    description: "业务线名称"
    examples: ["Defi", "Armada", "量化", "配资"]
  - name: "project_id"
    description: "项目号"
    examples: ["Defi00329", "DPLH002", "AE00801"]
  - name: "project_name"
    description: "项目简称"
  - name: "application_date"
    description: "申请日期"
    format: "YYYY-MM-DD"
  - name: "account_entity"
    description: "账户主体/公司名称"
  - name: "platform_name"
    description: "平台名称"
    examples: ["Binance", "OKX", "Gate"]
  - name: "currency"
    description: "币种"
    examples: ["BTC", "USDT", "ETH", "USD"]
  - name: "amount"
    description: "金额/数量"
  - name: "chain_name"
    description: "链名称/网络"
    examples: ["Ethereum", "BSC", "Solana"]
  # 人员/角色
  - name: "business_leader"
    description: "业务 leader（无固定邮箱时使用）"
  - name: "business_group_email"
    description: "业务群组邮箱（无固定邮箱时使用）"
  - name: "client_company"
    description: "客户/合作方公司名称"
  - name: "client_contact_email"
    description: "客户/合作方联系人邮箱"
  - name: "applicant_name"
    description: "申请人姓名"
  - name: "applicant_email"
    description: "申请人邮箱"
  # 账户/地址
  - name: "sub_account_name"
    description: "子账户名称"
  - name: "wallet_address"
    description: "钱包/区块链地址"
  - name: "ip_address"
    description: "IP 地址"
  - name: "urgency_level"
    description: "紧急程度"
    examples: ["优先处理", "常规"]

