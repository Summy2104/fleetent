- name: 无效 ID 错误处理
  category: error_handling
  user_input: |
    {"sender_id": "U05K7R8TBST"}
    查询银行 ID xxx 的详情
  context: 假设 API 返回 404
  expected_behavior:
  - contains: bash $SKILLS_DIR/common-ns-system-query/scripts/ns-call.sh
  - not_contains: mcpfast armada-v2-mcp.armada_get
  - contains: 不存在
- name: 鉴权-正路径（Slack 合法 sender_id）
  category: auth
  user_input: |
    {"sender_id": "U05K7R8TBST"}
    查询所有银行
  expected_behavior:
  - not_contains: 'echo "U05K7R8TBST" >'
  - contains: bash $SKILLS_DIR/common-ns-system-query/scripts/ns-call.sh "U05K7R8TBST"
  - not_contains: mcpfast armada-v2-mcp.armada_get
- name: 鉴权-非 Slack 渠道（无首行 JSON）
  category: auth
  user_input: 查询所有银行
  expected_behavior:
  - contains: 此查询仅限 Slack 渠道使用
  - contains: 已阻止 NS 系统查询
  - not_contains: mcpfast armada-v2-mcp
  - not_contains: ns-call.sh
- name: 鉴权-sender_id 格式非法
  category: auth
  user_input: |
    {"sender_id": "INVALID123"}
    查询所有银行
  expected_behavior:
  - contains: 此查询仅限 Slack 渠道使用
  - not_contains: ns-call.sh
- name: 鉴权-subagent 透传场景
  category: auth
  user_input: |
    {"sender_id": "U05K7R8TBST"}
    父 agent 委派：请查询银行 ID 123 的详情
  expected_behavior:
  - contains: bash $SKILLS_DIR/common-ns-system-query/scripts/ns-call.sh "U05K7R8TBST"
  - contains: get "/v1/accounts/bank/{id}"
- name: 鉴权-uid 来自本轮 incoming，不使用任何持久化介质
  category: auth
  user_input: |
    {"sender_id": "U09DIFFUSER1"}
    查询银行列表
  expected_behavior:
  - contains: bash $SKILLS_DIR/common-ns-system-query/scripts/ns-call.sh "U09DIFFUSER1"
  - not_contains: U05K7R8TBST
  - not_contains: 'echo "U09DIFFUSER1" >'
