image: python:3.12

definitions:
  caches:
    uv: ~/.cache/uv
    yarn: frontend/node_modules
  steps:
    - step: &unit-coverage
        name: unit tests + coverage
        caches:
          - uv
        script:
          - pip install uv
          - export ANTHROPIC_API_KEY=test-key
          - uv sync --frozen --group dev
          # Enforce the unit/integration layer boundary in CI (fast static scan,
          # runs before the heavier coverage step so a misclassified test fails fast).
          - make test-layers
          - uv run alembic upgrade head
          - make test-unit-ci
    - step: &frontend-gate
        name: frontend gate
        caches:
          - yarn
        script:
          - apt-get update
          - apt-get install -y curl ca-certificates gnupg
          - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          - apt-get install -y nodejs
          - corepack enable
          - yarn --version
          - make frontend-install
          - make frontend-build
          - make test-frontend
    - step: &daily-integration-coverage
        name: integration tests + combined coverage
        caches:
          - uv
        script:
          - pip install uv
          - export ANTHROPIC_API_KEY=test-key
          - uv sync --frozen --group dev
          - uv run alembic upgrade head
          - make test-coverage-ci

pipelines:
  pull-requests:
    '**':
      - step: *unit-coverage
      - step: *frontend-gate

  branches:
    main:
      - step: *unit-coverage
      - step: *frontend-gate

  custom:
    integration-tests:
      - step: *daily-integration-coverage
