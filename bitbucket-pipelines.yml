image: python:3.12

definitions:
  caches:
    uv: ~/.cache/uv
    yarn: frontend/node_modules
  steps:
    - step: &unit-coverage
        name: unit tests + coverage
        caches:
          - uv
        script:
          - pip install uv
          - export ANTHROPIC_API_KEY=test-key
          - uv sync --frozen --group dev
          # Enforce the unit/integration layer boundary in CI (fast static scan,
          # runs before the heavier coverage step so a misclassified test fails fast).
          - make test-layers
          - uv run alembic upgrade head
          - make test-unit-ci
    - step: &frontend-gate
        name: frontend gate
        # Node + make ship in the default node:22 image (Debian buildpack-deps base),
        # so we skip the per-run apt/nodesource install the python:3.12 image needed.
        image: node:22
        caches:
          - yarn
        script:
          - corepack enable
          - yarn --version
          - make frontend-install
          - make frontend-build
          - make test-frontend
    - step: &pr-integration
        name: integration tests
        caches:
          - uv
        script:
          - pip install uv
          - export ANTHROPIC_API_KEY=test-key
          - uv sync --frozen --group dev
          - uv run alembic upgrade head
          # Parallel, no coverage instrumentation: ~1min vs ~13min for the daily
          # coverage run. Gives integration a pre-merge signal it previously lacked
          # (it only ran in the daily custom pipeline, so integration-only breakage
          # passed PR + main and surfaced a day later).
          - make test-integration-ci
    - step: &daily-integration-coverage
        name: integration tests + combined coverage
        caches:
          - uv
        script:
          - pip install uv
          - export ANTHROPIC_API_KEY=test-key
          - uv sync --frozen --group dev
          - uv run alembic upgrade head
          - make test-coverage-ci

pipelines:
  pull-requests:
    '**':
      # Independent gates: run concurrently so wall-clock is max(), not sum().
      - parallel:
          - step: *unit-coverage
          - step: *frontend-gate
          - step: *pr-integration

  branches:
    main:
      - parallel:
          - step: *unit-coverage
          - step: *frontend-gate
          - step: *pr-integration

  custom:
    integration-tests:
      - step: *daily-integration-coverage
