# uv ships preinstalled in this image (full bookworm keeps make/git that the
# Makefile + alembic steps need), so the python steps skip the per-run
# `pip install uv` download. The frontend step overrides this with node:22.
image: ghcr.io/astral-sh/uv:python3.12-bookworm

definitions:
  caches:
    uv: ~/.cache/uv
    pnpm: ~/.local/share/pnpm
  steps:
    - step: &unit-coverage
        name: unit tests + coverage
        caches:
          - uv
        script:
          - export ANTHROPIC_API_KEY=test-key
          - uv sync --frozen --group dev
          # Enforce the unit/integration layer boundary in CI (fast static scan,
          # runs before the heavier coverage step so a misclassified test fails fast).
          - make test-layers
          - uv run alembic upgrade head
          - make test-unit-ci
    - step: &frontend-gate
        name: frontend gate
        # Node + make ship in the default node:22 image (Debian buildpack-deps base),
        # so we skip the per-run apt/nodesource install the python:3.12 image needed.
        image: node:22
        # 2x doubles the runner to 8GB / ~8 vCPU. The gate's wall-clock pole is the
        # vitest suite (288 CPU-bound component tests under v8 coverage); it was
        # pinned to maxWorkers:2 to dodge CPU-starvation flake on the 1x runner. On
        # 2x each of the (now 4) workers gets ~2 vCPU, so it runs ~halved AND with
        # more headroom — fewer starvation flakes, so the vitest retry rarely fires.
        size: 2x
        caches:
          - pnpm
        script:
          - corepack enable
          - pnpm --version
          - make frontend-install
          - make frontend-build
          - make test-frontend
    - step: &pr-integration
        name: integration tests
        # 2x doubles the runner to 8GB / ~8 vCPU. Integration is the wall-clock
        # pole — a broad tail of real-alembic migration round-trips that is purely
        # throughput-bound on the 1x runner — so more cores (CI_WORKERS=8) halves
        # it where the free wins (uv image, -n cap, install-script stub) could not.
        size: 2x
        caches:
          - uv
        script:
          - export ANTHROPIC_API_KEY=test-key
          - uv sync --frozen --group dev
          - uv run alembic upgrade head
          # Parallel, no coverage instrumentation. CI_WORKERS=8 matches the 2x
          # runner's vCPU allocation (the Makefile default 4 matches a 1x runner).
          - make test-integration-ci CI_WORKERS=8
    - step: &daily-integration-coverage
        name: integration tests + combined coverage
        caches:
          - uv
        script:
          - export ANTHROPIC_API_KEY=test-key
          - uv sync --frozen --group dev
          - uv run alembic upgrade head
          - make test-coverage-ci

pipelines:
  pull-requests:
    '**':
      # Independent gates: run concurrently so wall-clock is max(), not sum().
      - parallel:
          - step: *unit-coverage
          - step: *frontend-gate
          - step: *pr-integration

  branches:
    main:
      - parallel:
          - step: *unit-coverage
          - step: *frontend-gate
          - step: *pr-integration

  custom:
    integration-tests:
      - step: *daily-integration-coverage
