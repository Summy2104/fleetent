services:
  fleetent:
    build: .
    env_file: .env
    ports:
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./agents:/app/agents
      - ./platform.yaml:/app/platform.yaml
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
