sources:
  # Each entry defines one webhook source.
  # Copy this file to config/webhooks.yaml and fill in real values.

  - id: github-ci
    # Required: internal user ID that owns this webhook's agent runs.
    # Must exist in the users table (create with: uv run mini-agent-admin create-user).
    user_id: "replace-with-real-user-id"

    # Optional: HMAC-SHA256 secret for request verification.
    # When set, callers must include X-Hub-Signature-256: sha256=<hex> header.
    # Compatible with GitHub, GitLab, and most CI webhook formats.
    # Omit or leave empty for internal/trusted sources (no signature check).
    secret: "replace-with-webhook-secret"

    # Optional: name of the agent to run (matches agents.name in DB).
    # Falls back to channel binding → user binding → default agent if omitted.
    agent_name: "devops"

    # Optional: template to extract the agent's input text from the JSON payload.
    # Uses Python str.format_map syntax. Supports flat {key} and one-level
    # nested {key[subkey]} field references.
    # Falls back to json.dumps(payload) if the template fails or is omitted.
    message_template: "GitHub {event}: {repository[full_name]} — {head_commit[message]}"

  - id: internal-alert
    user_id: "replace-with-real-user-id"
    # No secret: suitable for internal network callers that don't sign requests.
    message_template: "Alert from {source}: {message}"
