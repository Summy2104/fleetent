jobs:
  # Static cron jobs loaded at server startup.
  # Copy this file to config/cron.yaml and fill in real values.
  # Dynamic jobs created via CLI or schedule_task tool are stored in SQLite
  # and take priority over YAML entries with the same id.

  - id: daily-standup
    # Human-readable name for admin display
    name: "Daily Standup Report"
    # Standard 5-field cron expression: minute hour day month day_of_week
    cron: "0 9 * * 1-5"
    # Timezone (IANA format). Defaults to UTC if omitted.
    timezone: "Asia/Shanghai"
    # Internal user_id that owns this run (must exist in users table).
    # Create with: uv run fleetent-admin create-user --name "cron-bot"
    user_id: "replace-with-real-user-id"
    # Optional: agent name to use. Falls back to default agent if omitted.
    agent_name: "analyst"
    # The prompt text sent to the agent each time this job fires.
    message: "Generate today's standup report for the team."

  - id: weekly-summary
    name: "Weekly Summary"
    cron: "0 18 * * 5"
    timezone: "Asia/Shanghai"
    user_id: "replace-with-real-user-id"
    message: "Summarize this week's key developments and prepare a report."
